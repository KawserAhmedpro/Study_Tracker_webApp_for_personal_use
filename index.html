<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="A private, local-first personal study time tracker with offline support, goal tracking, and detailed analytics." />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StudyTracker" />

  <title>StudyTracker — Local-First Study Time Tracker</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Core & Page Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/timer.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/statistics.css" />
  <link rel="stylesheet" href="css/settings.css" />

  <!-- Local Chart.js library (100% offline) -->
  <script src="assets/lib/chart.umd.min.js"></script>
</head>
<body>
  <!-- Header / Navigation -->
  <header class="app-header">
    <div class="header-container">
      <a href="#/dashboard" class="brand" aria-label="StudyTracker Home">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>
          </svg>
        </div>
        <span>StudyTracker</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="header-nav" aria-label="Primary Navigation">
        <a href="#/dashboard" class="nav-link" data-route="dashboard">
          <span>Dashboard</span>
        </a>
        <a href="#/timer" class="nav-link" data-route="timer">
          <span>Timer</span>
        </a>
        <a href="#/history" class="nav-link" data-route="history">
          <span>History</span>
        </a>
        <a href="#/statistics" class="nav-link" data-route="statistics">
          <span>Statistics</span>
        </a>
        <a href="#/settings" class="nav-link" data-route="settings">
          <span>Settings</span>
        </a>
      </nav>

      <!-- Header Actions (Live Pill & Theme Toggle) -->
      <div class="header-actions">
        <!-- Live Active Session Pill (Visible across all tabs when studying) -->
        <a href="#/timer" class="active-pill" id="global-active-pill" title="Active Study Session Running">
          <span class="active-pill-dot"></span>
          <span id="global-active-time">00:00:00</span>
        </a>

        <!-- Dark/Light Theme Toggle Button -->
        <button type="button" class="btn-icon" id="btn-theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
          <!-- Icon injected by theme service -->
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container (Routed SPA views mount here) -->
  <main class="main-content" id="view-container" role="main">
    <!-- View content loaded via client-side router -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <a href="#/dashboard" class="mobile-nav-item" data-route="dashboard">
      <span class="mobile-nav-icon" id="m-icon-dashboard"></span>
      <span>Dashboard</span>
    </a>
    <a href="#/timer" class="mobile-nav-item" data-route="timer">
      <span class="mobile-nav-icon" id="m-icon-timer"></span>
      <span>Timer</span>
    </a>
    <a href="#/history" class="mobile-nav-item" data-route="history">
      <span class="mobile-nav-icon" id="m-icon-history"></span>
      <span>History</span>
    </a>
    <a href="#/statistics" class="mobile-nav-item" data-route="statistics">
      <span class="mobile-nav-icon" id="m-icon-statistics"></span>
      <span>Stats</span>
    </a>
    <a href="#/settings" class="mobile-nav-item" data-route="settings">
      <span class="mobile-nav-icon" id="m-icon-settings"></span>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal Dialog Container -->
  <div id="modal-container"></div>

  <!-- Main Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
